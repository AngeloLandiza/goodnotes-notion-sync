[project]
name = "goodnotes-notion-sync"
version = "0.1.0"
description = "Link Notion assignments to the GoodNotes PDF of the same name in Google Drive"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.scripts]
goodnotes-notion-sync = "goodnotes_notion_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goodnotes_notion_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
